[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "creaper"
version = "0.56.1"
description = "Let Claude compose, mix and analyze in REAPER: an MCP server plus a REAPER bridge script"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "nickcapron" }]
keywords = ["reaper", "daw", "mcp", "claude", "midi", "mixing", "music"]
classifiers = [
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "mcp>=1.2",
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "luaparser>=3"]
# Opt-in, heavy (about 1 GB with the model): a music model's view of a mix (embeddings.py).
ml = ["transformers>=4.45", "torch>=2.6"]
# Opt-in (about 300 MB with the model): a speech recogniser that names the robot-vocal
# lines a listener would mishear (asr.py).
asr = ["faster-whisper>=1.1", "huggingface-hub>=0.21"]
# Opt-in: librosa's beat tracker for reference tracks (compare_to_reference).
analysis = ["librosa>=0.11"]

[project.urls]
Homepage = "https://github.com/nickcapron/creaper"
Issues = "https://github.com/nickcapron/creaper/issues"

[project.scripts]
creaper = "creaper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/creaper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
