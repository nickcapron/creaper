[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "creaper"
version = "0.7.2"
description = "Let Claude compose, mix and analyze in REAPER: an MCP server plus a REAPER bridge script"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "nickcapron" }]
keywords = ["reaper", "daw", "mcp", "claude", "midi", "mixing", "music"]
classifiers = [
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "mcp>=1.2",
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/nickcapron/creaper"
Issues = "https://github.com/nickcapron/creaper/issues"

[project.scripts]
creaper = "creaper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/creaper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
